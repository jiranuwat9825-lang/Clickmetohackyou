<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spyfall Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🕵️‍♂️ Spyfall ออนไลน์</h1>
        
        <!-- หน้าใส่ชื่อและห้อง -->
        <div id="roomSelection" class="box">
            <input type="text" id="nameInput" placeholder="ใส่ชื่อเล่นของคุณ">
            <input type="text" id="roomInput" placeholder="ใส่ชื่อห้อง (เช่น room99)">
            <button id="joinBtn" class="btn">เข้าห้องเกม</button>
        </div>
        
        <!-- หน้าล็อบบี้รอมต -->
        <div id="lobbyArea" class="box" style="display: none;">
            <h2 id="roomTitle">ชื่อห้อง</h2>
            <p class="subtitle">รายชื่อผู้เล่นในห้อง:</p>
            <ul id="playerList" class="player-list"></ul>
            <button id="startBtn" class="btn" style="display: none;">เริ่มเกม</button>
            <p id="waitText" class="status">รอหัวหน้าห้องกดเริ่มเกม...</p>
        </div>

        <!-- หน้าจอเล่นเกม -->
        <div id="gameArea" class="box" style="display: none;">
            <div class="role-card" id="roleCard">
                <h2 id="roleTitle">กำลังโหลดบทบาท...</h2>
                <p id="roleDesc">...</p>
            </div>
            <div class="timer-box" id="timerBox">เวลารอบนี้: <span id="timer">08:00</span></div>
            
            <h3 class="section-title">สถานที่ที่เป็นไปได้ทั้งหมด:</h3>
            <div class="location-grid" id="locationGrid"></div>

            <button id="restartBtn" class="btn secondary" style="margin-top: 15px; display: none;">กลับหน้าล็อบบี้</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
